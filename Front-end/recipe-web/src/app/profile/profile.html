<section class="profile-page">

  <!-- Loading -->
  <div
    *ngIf="isLoading"
    class="profile-card loading-container"
  >
    <div
      class="spinner-border text-danger"
      role="status"
    >
      <span class="visually-hidden">
        Loading...
      </span>
    </div>

    <p>Loading user data...</p>
  </div>

  <!-- Error -->
  <div
    *ngIf="errorMessage && !isLoading"
    class="profile-card"
  >
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      Back to Login
    </button>
  </div>

  <!-- Profile -->
  <div
    *ngIf="user && !isLoading && !errorMessage"
    class="profile-card"
  >

    <div class="profile-avatar">
      {{ (user.name || 'U').charAt(0).toUpperCase() }}
    </div>

    <h2 class="user-name">
      {{ user.name || 'User' }}
    </h2>

    <p class="user-email">
      {{ user.email || 'No email available' }}
    </p>

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      Logout
    </button>

  </div>

</section>
