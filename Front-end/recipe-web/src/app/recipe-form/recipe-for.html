<section class="form-page">
	<div class="form-panel">
		<header class="form-header">
			<h1>Create new recipe</h1>
			<p>Fill in the recipe details, ingredients, and step-by-step instructions.</p>
		</header>

		<form #recipeForm="ngForm" (ngSubmit)="onSubmit(recipeForm)" novalidate>
			<div class="field-group">
				<label for="recipe-title">Title</label>
				<input id="recipe-title" type="text" name="title" [(ngModel)]="recipe.title" required minlength="3" #title="ngModel" placeholder="Recipe name" />
				<small *ngIf="title.touched && title.invalid">
					Recipe title is required (min 3 characters).
				</small>
			</div>

			<div class="field-group">
				<label for="recipe-description">Description</label>
				<textarea id="recipe-description" name="description" [(ngModel)]="recipe.description" required #description="ngModel" rows="3" placeholder="Tell us about this recipe"></textarea>
				<small *ngIf="description.touched && description.invalid">
					Recipe description is required.
				</small>
			</div>

			<div class="field-group">
				<label for="recipe-category">Category</label>
				<select id="recipe-category" name="category" [(ngModel)]="recipe.category" required>
					<option value="" disabled>Select a category</option>
					<option *ngFor="let category of categories" [value]="category">{{ category }}</option>
				</select>
			</div>

			<div class="field-group">
				<label for="image-url">Image URL (Optional)</label>
				<input id="image-url" type="url" name="imageUrl" [(ngModel)]="recipe.imageUrl" placeholder="https://example.com/recipe-image.jpg" />
			</div>

			<div class="field-group">
				<label for="ingredients-text">Ingredients</label>
				<textarea id="ingredients-text" name="ingredients" [(ngModel)]="recipe.ingredients" required rows="5" placeholder="One ingredient per line"></textarea>
				<em>Type each ingredient on a new line.</em>
			</div>

			<div class="field-group">
				<label for="instructions-text">Instructions</label>
				<textarea id="instructions-text" name="instructions" [(ngModel)]="recipe.instructions" required rows="6" placeholder="Explain how to prepare the recipe"></textarea>
				<em>Include the preparation steps in order.</em>
			</div>

			<div class="form-actions">
				<button type="button" class="cancel-button" (click)="cancel()">Cancel</button>
				<button type="submit" class="save-button">Save recipe</button>
			</div>
		</form>
	</div>
</section>
