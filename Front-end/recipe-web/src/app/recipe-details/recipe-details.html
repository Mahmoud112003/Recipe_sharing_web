<div *ngIf="recipe" class="recipe-container">
  
  <!-- Back Button -->
  <button (click)="goBack()" class="back-btn">
    <svg class="back-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
    Back to Recipes
  </button>

  <!-- Recipe Details Top Banner Card -->
  <div class="banner-card">
    <div class="banner-content">
      
      <!-- Thumbnail Box -->
      <div [class]="recipe.cardBgColor || 'default-thumb-bg'" class="thumb-box">
        <img 
          *ngIf="recipe.imageUrl" 
          [src]="recipe.imageUrl" 
          [alt]="recipe.title" 
          class="thumb-img"
        />
        <span *ngIf="!recipe.imageUrl" class="thumb-fallback">
          {{ recipe.title.charAt(0) }}
        </span>
      </div>

      <!-- Title & Meta details -->
      <div class="meta-details">
        <div class="badges-group">
          <span class="badge brand-badge">
            {{ recipe.category }}
          </span>
        </div>

        <h1 class="recipe-title">
          {{ recipe.title }}
        </h1>

        <p class="recipe-info">
          <span>{{ recipe.ingredients.length }} ingredients</span>
        </p>

        <!-- Edit & Delete Buttons -->
        <div *ngIf="isAuthor()" class="action-buttons">
          <button (click)="editRecipe()" class="btn btn-edit">
            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            Edit
          </button>

          <button (click)="deleteRecipe()" class="btn btn-delete">
            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
            Delete
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Ingredients & Steps Section Grid -->
  <div class="details-grid">
    
    <!-- Ingredients Panel -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <span>🥗</span> Ingredients
        </h2>
        <span class="panel-count">
          {{ recipe.ingredients.length }} items
        </span>
      </div>

      <ul class="item-list">
        <li 
          *ngFor="let ingredient of recipe.ingredients; let i = index" 
          (click)="toggleIngredient(i)"
          class="list-item">
          <input 
            type="checkbox" 
            [checked]="checkedIngredients[i]"
            (change)="toggleIngredient(i)"
            class="checkbox-input"
          />
          <span 
            class="item-text"
            [class.completed]="checkedIngredients[i]">
            {{ ingredient }}
          </span>
        </li>
      </ul>
    </div>

    <!-- Steps Panel -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <span>👩‍🍳</span> Steps
        </h2>
        <span class="panel-count">
          Preparation
        </span>
      </div>

      <ol class="item-list">
        <li 
          *ngFor="let step of recipe.instructions.split('\n'); let i = index" 
          (click)="toggleStep(i)"
          class="list-item step-item"
          [class.step-done]="completedSteps[i]">
          
          <div 
            class="step-number"
            [class.step-number-done]="completedSteps[i]">
            <span *ngIf="!completedSteps[i]">{{ i + 1 }}</span>
            <svg *ngIf="completedSteps[i]" class="check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          
          <p class="item-text" [class.completed]="completedSteps[i]">
            {{ step }}
          </p>
        </li>
      </ol>
    </div>

  </div>

</div>
